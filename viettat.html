<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viết tắt">
<meta name="theme-color" content="#f8f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="viettat.webmanifest">
<link rel="apple-touch-icon" href="viettat-icon-180.png">
<link rel="icon" type="image/png" href="viettat-icon-192.png">
<title>Viết tắt — Duyên AI CRM</title>
<style>
  /* Màu + bo góc lấy đúng từ app Android (MainActivity.kt / Picker.kt): nền #F8F7F5, accent #1E66F5, ô tìm bo 28, thẻ bo 12; tự đổi sáng/tối theo hệ thống. */
  :root { --bg:#f8f7f5; --card:#fff; --line:#ddd; --blue:#1e66f5; --txt:#111; --muted:#666; --tint:#dce8fe; --bar:#eceaf0; --stat:#e3ebfd; --warn:#fde8e8; --shadow:rgba(0,0,0,.18); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f21; --card:#2a2a2d; --line:#3c3c40; --blue:#6fa0ff; --txt:#eee; --muted:#aaa; --tint:#2b3a55; --bar:#38383b; --stat:#26324a; --warn:#4a2a2a; --shadow:rgba(0,0,0,.55); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:calc(24px + env(safe-area-inset-bottom)); touch-action:manipulation; }
  body.lock { overflow:hidden; }
  /* iOS Safari chỉ phát sự kiện bấm cho phần tử "bấm được" — cho cả trang con trỏ tay để bấm vào nền (đóng menu/bảng) luôn nhận */
  @media (hover:none) { body { cursor:pointer; } }
  button, input { font:inherit; color:inherit; -webkit-appearance:none; appearance:none; margin:0; }
  button { cursor:pointer; }
  header { position:sticky; top:0; z-index:15; background:var(--bg); padding:10px 12px 8px; padding-top:calc(10px + env(safe-area-inset-top)); padding-left:calc(12px + env(safe-area-inset-left)); padding-right:calc(12px + env(safe-area-inset-right)); }
  .row { display:flex; gap:8px; align-items:center; }
  .btn { border:0; border-radius:20px; padding:10px 16px; background:var(--bar); color:var(--txt); white-space:nowrap; }
  .btn.pri { background:var(--blue); color:#fff; }
  .btn:disabled { opacity:.4; }
  .hint { color:var(--muted); font-size:13px; margin:6px 2px 0; }
  /* thẻ trạng thái trên cùng (giống thẻ "Viết tắt đang bật" của app) */
  #stat { display:flex; align-items:center; gap:4px; background:var(--stat); border-radius:14px; padding:8px 4px 8px 16px; position:relative; }
  #stat .tx { flex:1; min-width:0; }
  #stat b { display:block; font-size:15px; }
  #stat span.sub { display:block; font-size:12.5px; color:var(--muted); }
  #stat.off { background:var(--warn); }
  #dots { flex:0 0 auto; width:44px; height:44px; border:0; background:none; font-size:22px; border-radius:22px; }
  #menu { position:absolute; right:6px; top:50px; z-index:12; background:var(--card); border-radius:12px; box-shadow:0 8px 24px var(--shadow); padding:6px 0; min-width:210px; }
  #menu button { display:block; width:100%; text-align:left; border:0; background:none; padding:13px 18px; }
  #menu button:active { background:var(--tint); }
  /* ô tìm bo tròn */
  #qwrap { position:relative; margin-top:10px; }
  #q { width:100%; font-size:16px; padding:12px 44px 12px 18px; border:1px solid var(--line); border-radius:28px; background:var(--card); }
  #q:focus { outline:2px solid var(--blue); outline-offset:-1px; border-color:transparent; }
  #qx { position:absolute; right:2px; top:2px; width:44px; height:44px; border:0; background:none; color:var(--muted); font-size:17px; display:none; }
  #qwrap.has #qx { display:block; }
  /* hàng chip: thư mục · số mục · tên khách */
  .chiprow { margin-top:8px; align-items:center; }
  #nhomWrap { position:relative; min-width:0; flex:0 1 auto; max-width:58%; }
  #nhomBtn { display:block; max-width:100%; border:1px solid var(--line); border-radius:10px; background:var(--card); padding:8px 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  #cnt { flex:0 0 auto; color:var(--muted); font-size:13px; }
  #cust { flex:1 1 90px; min-width:0; font-size:16px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  #nhomPanel { position:absolute; left:0; top:calc(100% + 4px); z-index:20; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px var(--shadow); max-height:55vh; max-height:55dvh; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:6px; width:min(86vw,340px); }
  #nhomPanel .tools { display:flex; gap:16px; padding:2px 8px 6px; font-size:14px; color:var(--blue); }
  #nhomPanel .tools a { color:var(--blue); text-decoration:none; padding:4px 0; }
  .tn { display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:8px; }
  .tn.on { background:var(--tint); font-weight:600; }
  .tn .tg { flex:0 0 34px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }
  .tn .tl { flex:1; min-width:0; padding:10px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tn .tc { flex:0 0 auto; font-size:12px; color:var(--muted); padding-right:6px; }
  .tkids { border-left:2px solid var(--line); margin-left:19px; }
  #nback, #mback { position:fixed; inset:0; z-index:10; cursor:pointer; }
  #inst { display:none; margin:8px 12px 0; padding:10px 12px; background:#fff8e1; color:#333; border:1px solid #f1d98a; border-radius:12px; font-size:14px; }
  #inst b { font-weight:700; } #inst .x { float:right; border:0; background:none; font-size:18px; color:#888; }
  /* danh sách mục: thẻ giống app (tiêu đề đậm + ☁ CRM, từ khoá, xem trước 2 dòng, số nội dung) */
  main { padding:4px 12px 8px; padding-left:calc(12px + env(safe-area-inset-left)); padding-right:calc(12px + env(safe-area-inset-right)); }
  .sn { position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; margin:8px 0; padding:12px 14px; cursor:pointer; -webkit-user-select:none; user-select:none; }
  .sn:active { background:var(--tint); }
  .sn .r1 { display:flex; align-items:baseline; gap:8px; }
  .sn .ab { flex:1; min-width:0; font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sn .tag { flex:0 0 auto; font-size:11.5px; color:var(--blue); }
  .sn .kw { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sn .pv { margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .sn .ft { margin-top:6px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .sn .ft .fo { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; }
  .sn .qc { flex:0 0 auto; border:0; border-radius:16px; background:var(--tint); color:var(--blue); font-size:13px; padding:7px 12px; }
  .empty { text-align:center; color:var(--muted); padding:32px 16px; white-space:pre-line; }
  .more { display:block; width:100%; margin:8px 0; }
  /* bảng chọn nội dung (giống Picker của app: chạm chọn nhiều, thanh nổi Chia sẻ / Chèn) */
  #sheet { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; justify-content:flex-end; }
  #sheet[hidden] { display:none; }
  #sback { position:absolute; inset:0; background:rgba(0,0,0,.4); cursor:pointer; }
  #spanel { position:relative; background:var(--bg); border-radius:18px 18px 0 0; max-height:82vh; max-height:82dvh; display:flex; flex-direction:column; box-shadow:0 -6px 24px var(--shadow); }
  .sh-top { display:flex; align-items:center; gap:8px; padding:14px 16px 6px; }
  .sh-top .t { flex:1; min-width:0; }
  .sh-top b { display:block; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sh-top .sub { font-size:12.5px; color:var(--muted); }
  .lnk { border:0; background:none; color:var(--blue); font-size:14px; padding:8px 4px; }
  #sh-body { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:4px 12px 12px; touch-action:pan-y; }
  .opt { display:flex; align-items:flex-start; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0; cursor:pointer; }
  .opt.on { background:var(--tint); border:2px solid var(--blue); padding:9px 11px; }
  .opt .t { flex:1; min-width:0; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .opt .play { flex:0 0 auto; border:0; border-radius:16px; background:var(--bar); padding:6px 12px; font-size:13px; }
  .mark { flex:0 0 24px; height:24px; border-radius:12px; border:2px solid #9e9e9e; background:rgba(0,0,0,.08); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .on > .mark, .on .mark { background:var(--blue); border-color:var(--blue); }
  .sh-h { margin:12px 2px 4px; font-size:13px; font-weight:600; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tile { position:relative; padding-top:100%; border-radius:10px; overflow:hidden; background:var(--card); border:2px solid transparent; cursor:pointer; }
  .tile.on { border-color:var(--blue); }
  .tile .pic, .tile .pic-wait { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:var(--muted); padding:4px; }
  .tile .mark { position:absolute; top:6px; left:6px; z-index:2; width:24px; border-color:#fff; }
  .tile .zm { position:absolute; right:4px; bottom:4px; z-index:2; width:34px; height:34px; border:0; border-radius:17px; background:rgba(0,0,0,.45); color:#fff; font-size:15px; }
  #bar { display:flex; align-items:center; gap:8px; background:var(--bar); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  #bar .x { flex:0 0 auto; width:44px; padding:10px 0; text-align:center; background:none; font-size:18px; }
  #bar .n { flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar .btn { padding:11px 14px; }
  #pv { position:fixed; inset:0; z-index:40; background:#000; display:none; align-items:center; justify-content:center; cursor:pointer; }
  #pv img { max-width:100%; max-height:100%; object-fit:contain; }
  #toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:12px; max-width:88vw; z-index:60; display:none; text-align:center; }
  #setup { padding:24px 4px; }
  #setup input { width:100%; font-size:16px; padding:12px 16px; border:1px solid var(--line); border-radius:28px; background:var(--card); }
</style>
</head>
<body>
<header>
  <div id="setup" style="display:none"></div>
  <div id="top" style="display:none">
    <div id="stat"><div class="tx"><b id="stat-t">Đang tải…</b><span class="sub" id="stat-s"></span></div><button type="button" id="dots" aria-label="Menu">⋮</button>
      <div id="menu" hidden><button type="button" id="reload">☁ Cập nhật từ CRM</button><button type="button" id="chg">✏ Đổi tên CS</button></div></div>
    <div id="qwrap"><input id="q" type="text" placeholder="Tìm viết tắt, từ khoá, nội dung" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button type="button" id="qx" aria-label="Xoá">✕</button></div>
    <div class="row chiprow"><div id="nhomWrap"><button type="button" id="nhomBtn">📁 Tất cả ▾</button><div id="nhomPanel" hidden></div></div><span id="cnt"></span><input id="cust" type="text" placeholder="Tên khách ({tên})" autocomplete="off" autocorrect="off" spellcheck="false"></div>
  </div>
</header>
<div id="inst"><button class="x" id="instx" aria-label="Đóng">✕</button><span id="insttxt"></span> <button class="btn pri" id="instbtn" style="display:none;padding:6px 12px;margin-left:6px">Cài ngay</button></div>
<main id="list"></main>
<div id="nback" hidden></div><div id="mback" hidden></div>
<div id="sheet" hidden>
  <div id="sback"></div>
  <div id="spanel" role="dialog" aria-modal="true">
    <div class="sh-top"><div class="t"><b id="sh-ab"></b><div class="sub" id="sh-sub"></div></div><button type="button" class="lnk" id="sh-all">Chọn hết</button></div>
    <div id="sh-body"></div>
    <div id="bar"><button type="button" class="btn x" id="clear" aria-label="Đóng">✕</button><span class="n" id="seln">Chưa chọn</span><button type="button" class="btn" id="share" disabled>Chia sẻ</button><button type="button" class="btn pri" id="copy" disabled>Sao chép</button></div>
  </div>
</div>
<div id="pv"><img alt=""></div>
<audio id="aud" playsinline preload="none"></audio>
<div id="toast"></div>
<script>
'use strict';
// Trang "Viết tắt" cho ĐIỆN THOẠI (iPhone/Safari + Android/Chrome, mở bằng trình duyệt hoặc "Thêm vào màn hình chính"). Cùng kho với CRM (sheet VietTat qua GAS action=vietTat).
// Giao diện bám app Android: thẻ trạng thái, ô tìm bo tròn, chip thư mục, thẻ mục (viết tắt đậm / từ khoá / xem trước / số nội dung), bảng chọn nhiều nội dung + hình + ghi âm.
// Khác app Android: iPhone KHÔNG cho app nào đọc ô gõ của Zalo/Messenger nên không tự bung khi gõ — mở trang này, tìm, chạm chọn rồi Sao chép/Chia sẻ và dán vào ô chat.
var GAS = 'https://script.google.com/macros/s/AKfycbx3QT6YIzQ7SQEwQPkljVeEdmTSBQQSxtTp2hTFYOeCKB_K4BHcUTSLi54LlmB9q_E6sQ/exec';
var S = { name: '', snaps: [], sel: new Set(), q: '', nhom: '', open: {}, items: [], cur: null, shown: 0, limit: 120 };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) {} return ''; }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2800); }
function fold(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim(); }

// ── biến trong nội dung (giống app Android): {ngày} {ngày mai} {giờ} {thứ} {tên} {tên khách} {tên đầy đủ} ──
function given(full) { var p = String(full || '').trim().split(/\s+/); return p[p.length - 1] || ''; }
function resolve(t, name, now) {
  now = now || new Date();
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var dmy = function (d) { return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); };
  var tm = new Date(now.getTime() + 86400000);
  var thu = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'][now.getDay()];
  var r = String(t).split('{ngày mai}').join(dmy(tm)).split('{ngày}').join(dmy(now)).split('{giờ}').join(p2(now.getHours()) + ':' + p2(now.getMinutes())).split('{thứ}').join(thu);
  if (name && name.trim()) r = r.split('{tên đầy đủ}').join(name.trim()).split('{tên khách}').join(given(name)).split('{tên}').join(given(name));
  return r;
}

// ── dữ liệu ──
// Thư mục: nhom dạng "Mẹ/Con/Cháu". S.nhom: '' = tất cả · '*chung' = mục không thuộc thư mục · "Mẹ/Con" = thư mục đó + mọi thư mục con.
var CHUNG = '*chung';
function nPath(n) { return String(n || '').split('/').map(function (x) { return x.trim(); }).filter(Boolean).join('/'); }
function nhomLabel(n) { return nPath(n).split('/').join(' › '); }
function inNhom(sn, sel) {
  if (sel === '') return true;
  var p = nPath(sn);
  if (sel === CHUNG) return p === '';
  return p === sel || p.indexOf(sel + '/') === 0;
}
function buildTree() {
  var root = { kids: {}, order: [] }, chung = 0;
  S.snaps.forEach(function (s) {
    var parts = nPath(s.nhom).split('/').filter(Boolean);
    if (!parts.length) { chung++; return; }
    var cur = root;
    parts.forEach(function (nm, i) {
      if (!cur.kids[nm]) { cur.kids[nm] = { name: nm, path: parts.slice(0, i + 1).join('/'), kids: {}, count: 0 }; }
      cur = cur.kids[nm]; cur.count++;
    });
  });
  return { root: root, chung: chung };
}
function sortedKids(n) { return Object.keys(n.kids).sort(function (a, b) { return a.localeCompare(b, 'vi'); }).map(function (k) { return n.kids[k]; }); }
function treeRows(n, depth) {
  return sortedKids(n).map(function (c) {
    var has = sortedKids(c).length > 0, open = !!S.open[c.path];
    return '<div class="tn' + (S.nhom === c.path ? ' on' : '') + '"><span class="tg" data-tg="' + esc(c.path) + '">' + (has ? (open ? '▾' : '▸') : '·') + '</span><span class="tl" data-pick="' + esc(c.path) + '">📁 ' + esc(c.name) + '</span><span class="tc">' + c.count + '</span></div>' +
      (has && open ? '<div class="tkids">' + treeRows(c, depth + 1) + '</div>' : '');
  }).join('');
}
function expandPath(p) { var parts = p.split('/'); for (var i = 1; i <= parts.length; i++) S.open[parts.slice(0, i).join('/')] = true; }
function allPaths(n, out) { sortedKids(n).forEach(function (c) { out.push(c.path); allPaths(c, out); }); return out; }
function fillNhom() {
  var t = buildTree();
  var lab = S.nhom === '' ? '📁 Tất cả' : (S.nhom === CHUNG ? '📁 Chung' : '📁 ' + nhomLabel(S.nhom));
  $('nhomBtn').textContent = lab + ' ▾';
  $('nhomPanel').innerHTML = '<div class="tools"><a href="#" data-all="1">Mở hết</a><a href="#" data-all="0">Thu hết</a></div>' +
    '<div class="tn' + (S.nhom === '' ? ' on' : '') + '"><span class="tg"></span><span class="tl" data-pick="">🗂 Tất cả thư mục</span><span class="tc">' + S.snaps.length + '</span></div>' +
    (t.chung ? '<div class="tn' + (S.nhom === CHUNG ? ' on' : '') + '"><span class="tg"></span><span class="tl" data-pick="' + CHUNG + '">Chung (chưa vào thư mục)</span><span class="tc">' + t.chung + '</span></div>' : '') +
    treeRows(t.root, 0);
}
// Gọi GAS có hạn giờ — Safari/mạng yếu không treo mãi ở "Đang tải…"
function getJson(url, ms) {
  var ac = (typeof AbortController !== 'undefined') ? new AbortController() : null, to = ac ? setTimeout(function () { ac.abort(); }, ms || 25000) : 0;
  var opt = { redirect: 'follow' }; if (ac) opt.signal = ac.signal;
  return fetch(url, opt).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(to); return j; }, function (e) { clearTimeout(to); throw (e && e.name === 'AbortError') ? new Error('mạng chậm quá') : e; });
}
function stamp() {
  var n = S.snaps.length, tm = ls('vt_time');
  var ok = n > 0;
  $('stat').className = ok ? '' : 'off';
  $('stat-t').textContent = ok ? ('● Sẵn sàng · ' + n + ' mục từ CRM') : '○ Chưa có dữ liệu';
  $('stat-s').textContent = ok ? ('Tên CS: ' + S.name + (tm ? ' · cập nhật ' + tm : '') + ' — chạm mục → chọn → Sao chép → dán vào ô chat') : 'Bấm ⋮ › Cập nhật từ CRM để tải về';
}
async function loadData(force) {
  var cached = ls('vt_cache');
  if (cached && !force) { try { S.snaps = JSON.parse(cached); } catch (e) { S.snaps = []; } }
  stamp(); fillNhom(); render();
  try {
    var j = await getJson(GAS + '?action=vietTat&by=' + encodeURIComponent(S.name), 25000);

  if (ios) { txt.innerHTML = '📲 Cài thành app: bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên ↑) ở thanh Safari → <b>Thêm vào MH chính</b>. (Phải mở bằng <b>Safari</b>.)'; box.style.display = 'block'; }

  btn.onclick = function () { if (!dp) return; dp.prompt(); dp.userChoice.then(function () { dp = null; hide(); }); };
