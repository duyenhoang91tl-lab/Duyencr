<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viết tắt">
<meta name="theme-color" content="#1e66f5">
<title>Viết tắt — Duyên AI CRM</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d0d0d0; --blue:#1e66f5; --txt:#111; --muted:#667085; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 12px calc(8px); padding-top:calc(10px + env(safe-area-inset-top)); }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=text], select { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; }
  #q { font-size:18px; }
  .btn { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:#e6e8ec; color:#222; white-space:nowrap; }
  .btn.pri { background:var(--blue); color:#fff; }
  .hint { color:var(--muted); font-size:13px; margin:6px 2px 0; }
  main { padding:8px 10px; }
  .grp { margin:14px 2px 4px; font-size:13px; color:var(--muted); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:8px 0; padding:14px 12px; display:flex; gap:12px; align-items:flex-start; user-select:none; -webkit-user-select:none; position:relative; }
  .card.on { border:3px solid var(--blue); background:#e8f0fe; padding:12px 10px; }
  .mark { flex:0 0 28px; height:28px; border-radius:14px; border:2px solid #9e9e9e; background:rgba(255,255,255,.4); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .card.on .mark { background:var(--blue); border-color:var(--blue); }
  .txt { white-space:pre-wrap; word-break:break-word; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .chip { background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 14px; }
  #bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:8px 10px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; z-index:6; }
  #bar .btn { flex:1; padding:13px 8px; }
  #bar .btn:disabled { opacity:.45; }
  #toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:10px; max-width:88vw; z-index:9; display:none; }
  #setup { padding:24px 16px; }
</style>
</head>
<body>
<header>
  <div id="setup" style="display:none"></div>
  <div id="top" style="display:none">
    <div class="row"><input id="q" type="text" placeholder="Gõ viết tắt hoặc từ khoá…" autocomplete="off" autocapitalize="off" autocorrect="off"><button class="btn" id="reload" title="Tải lại từ CRM">🔄</button></div>
    <div class="row" style="margin-top:8px"><select id="nhom"></select><input id="cust" type="text" placeholder="Tên khách (cho {tên})" autocomplete="off"></div>
    <div class="hint" id="who"></div>
  </div>
</header>
<main id="list"></main>
<div id="bar" style="display:none">
  <button class="btn" id="clear">✕ Bỏ chọn</button>
  <button class="btn" id="copy" disabled>Sao chép</button>
</div>
<div id="toast"></div>
<script>
'use strict';
// Trang "Viết tắt" cho ĐIỆN THOẠI (iPhone + Android, mở bằng trình duyệt / thêm vào màn hình chính). Cùng kho với CRM (sheet VietTat qua GAS action=vietTat).
// Khác app Android: không tự hiện khi gõ trong Zalo/Messenger (iPhone không cho) — bạn mở trang này, chọn nội dung rồi Sao chép/Chia sẻ và dán vào ô chat.
var GAS = 'https://script.google.com/macros/s/AKfycbx3QT6YIzQ7SQEwQPkljVeEdmTSBQQSxtTp2hTFYOeCKB_K4BHcUTSLi54LlmB9q_E6sQ/exec';
var S = { name: '', snaps: [], sel: new Set(), q: '', nhom: '', items: [] };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) {} return ''; }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600); }
function fold(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim(); }

// ── biến trong nội dung (giống app Android): {ngày} {ngày mai} {giờ} {thứ} {tên} {tên khách} {tên đầy đủ} ──
function given(full) { var p = String(full || '').trim().split(/\s+/); return p[p.length - 1] || ''; }
function resolve(t, name, now) {
  now = now || new Date();
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var dmy = function (d) { return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); };
  var tm = new Date(now.getTime() + 86400000);
  var thu = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'][now.getDay()];
  var r = String(t).split('{ngày mai}').join(dmy(tm)).split('{ngày}').join(dmy(now)).split('{giờ}').join(p2(now.getHours()) + ':' + p2(now.getMinutes())).split('{thứ}').join(thu);
  if (name && name.trim()) r = r.split('{tên đầy đủ}').join(name.trim()).split('{tên khách}').join(given(name)).split('{tên}').join(given(name));
  return r;
}

// ── dữ liệu ──
function nhomLabel(n) { return String(n || '').split('/').map(function (x) { return x.trim(); }).filter(Boolean).join(' › '); }
async function loadData(force) {
  var cached = ls('vt_cache');
  if (cached && !force) { try { S.snaps = JSON.parse(cached); } catch (e) { S.snaps = []; } }
  try {
    var r = await fetch(GAS + '?action=vietTat&by=' + encodeURIComponent(S.name), { redirect: 'follow' });
    var j = await r.json();
    if (!j || j.error || !Array.isArray(j.snippets)) throw new Error((j && j.error) || 'CRM không trả dữ liệu');
    S.snaps = j.snippets; ls('vt_cache', JSON.stringify(S.snaps));
    if (force) toast('Đã cập nhật ' + S.snaps.length + ' mục từ CRM');
  } catch (e) {
    if (!S.snaps.length) toast('Không tải được từ CRM: ' + (e && e.message || e)); else if (force) toast('Không cập nhật được, dùng bản đã lưu trên máy');
  }
  fillNhom(); render();
}
function fillNhom() {
  var set = {}; S.snaps.forEach(function (s) { set[s.nhom || ''] = 1; });
  var keys = Object.keys(set).sort();
  $('nhom').innerHTML = '<option value="">🗂 Tất cả thư mục</option>' + keys.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k ? nhomLabel(k) : 'Chung') + '</option>'; }).join('');
  $('nhom').value = S.nhom;
}
function matches(s, q) {
  if (S.nhom !== '' && (s.nhom || '') !== S.nhom) return false;
  if (!q) return true;
  var f = fold(q);
  if (fold(s.abbr).indexOf(f) === 0) return true;
  if (String(s.keyword || '').split(',').some(function (k) { k = fold(k); return k && k.indexOf(f) === 0; })) return true;
  return f.length >= 3 && (s.options || []).some(function (o) { return fold(o).indexOf(f) >= 0; });
}

// ── hiển thị ──
function render() {
  var list = $('list'), q = S.q.trim();
  S.items = [];
  if (!q && S.nhom === '') {
    var cs = {}; S.snaps.forEach(function (s) { cs[s.nhom || ''] = 1; });
    list.innerHTML = '<div class="hint">Gõ viết tắt hoặc từ khoá ở ô trên, hoặc chọn thư mục:</div><div class="chips">' +
      Object.keys(cs).sort().map(function (k) { return '<span class="chip" data-nhom="' + esc(k) + '">' + esc(k ? nhomLabel(k) : 'Chung') + '</span>'; }).join('') + '</div>' +
      (S.snaps.length ? '' : '<div class="hint">Chưa có dữ liệu — bấm 🔄 để tải từ CRM.</div>');
    bar(); return;
  }
  var html = '', n = 0;
  S.snaps.filter(function (s) { return matches(s, q); }).forEach(function (s) {
    html += '<div class="grp">' + esc(s.abbr) + (s.nhom ? ' · ' + esc(nhomLabel(s.nhom)) : '') + (s.scope === 'me' ? ' · của tôi' : '') + '</div>';
    (s.options || []).forEach(function (o, i) {
      var it = { key: s.id + '#' + i, text: o }; S.items.push(it); n++;
      html += '<div class="card' + (S.sel.has(it.key) ? ' on' : '') + '" data-k="' + esc(it.key) + '"><div class="mark">' + (S.sel.has(it.key) ? '✓' : '') + '</div><div class="txt">' + esc(resolve(o, $('cust').value)) + '</div></div>';
    });
  });
  list.innerHTML = html || '<div class="hint">Không có kết quả cho “' + esc(q) + '”.</div>';
  bar();
}
function bar() {
  var n = S.sel.size;
  $('bar').style.display = 'flex';
  $('copy').disabled = n === 0; $('copy').textContent = n ? 'Sao chép (' + n + ')' : 'Sao chép';
  $('clear').disabled = n === 0;
}
function toggle(k) { if (!S.sel.delete(k)) S.sel.add(k); render(); }
function selectedItems() { return S.items.filter(function (i) { return S.sel.has(i.key); }); }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try { var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e2) { return false; }
}
async function doCopy() {
  var its = selectedItems(); if (!its.length) return;
  var t = its.map(function (i) { return resolve(i.text, $('cust').value); }).join('\n');
  toast((await copyText(t)) ? 'Đã sao chép ' + its.length + ' nội dung — dán vào ô chat' : 'Không sao chép được — nhấn giữ chữ để chép tay');
}

// ── khởi động ──
function showSetup() {
  $('top').style.display = 'none';
  $('setup').style.display = 'block';
  $('setup').innerHTML = '<h2 style="margin:0 0 8px">Viết tắt</h2><div class="hint" style="margin-bottom:12px">Nhập <b>Tên CS</b> giống tên trong CRM để lấy mục CHUNG của team + mục RIÊNG của bạn.</div><input id="nm" type="text" placeholder="Tên CS" value="' + esc(S.name) + '"><div style="margin-top:12px"><button class="btn pri" id="save" style="width:100%">Lưu & tải dữ liệu</button></div>';
  $('save').onclick = function () { var v = $('nm').value.trim(); if (!v) { toast('Nhập tên CS'); return; } S.name = v; ls('vt_name', v); start(); };
}
function start() {
  $('setup').style.display = 'none'; $('top').style.display = 'block';
  $('who').innerHTML = 'Đang dùng: <b>' + esc(S.name) + '</b> · <a href="#" id="chg">đổi tên</a> · bấm 1 lần để chọn nhiều nội dung';
  $('chg').onclick = function (e) { e.preventDefault(); showSetup(); };
  loadData(false);
}
$('q').addEventListener('input', function () { S.q = this.value; render(); });
$('nhom').addEventListener('change', function () { S.nhom = this.value; render(); });
$('cust').addEventListener('input', function () { ls('vt_cust', this.value); render(); });
$('reload').onclick = function () { loadData(true); };
$('clear').onclick = function () { S.sel.clear(); render(); };
$('copy').onclick = doCopy;
$('list').addEventListener('click', function (e) {
  var ch = e.target.closest('[data-nhom]'); if (ch) { S.nhom = ch.getAttribute('data-nhom'); $('nhom').value = S.nhom; render(); return; }
  var c = e.target.closest('.card'); if (c) toggle(c.getAttribute('data-k'));
});
S.name = ls('vt_name'); $('cust').value = ls('vt_cust');
if (S.name) start(); else showSetup();
</script>
</body>
</html>
