# Tự động đưa backend GAS lên Apps Script mỗi khi push main (không cần dán tay).
# Cần 2 Secret trong repo: CLASPRC_JSON (nội dung ~/.clasprc.json) và GAS_SCRIPT_ID.
# Hướng dẫn cài 1 lần: docs/GAS-AUTO-DEPLOY.md
name: Deploy GAS to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'gas_v13.js'
      - 'gas/**'
      - 'tools/split-gas.js'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ID deployment Web App CRM đang gọi (= GAS_URL_DIRECT trong js/06-main-renew-sources.js; FIXED_GS_URL của web CRM nay là URL Cloudflare Worker, Worker chuyển tiếp tới deployment này qua biến GAS_URL). PHẢI khớp, nếu không deploy đi nhầm chỗ.
      # (ID cũ AKfycbxyqBM3v7_... KHÔNG phải URL CRM dùng.) Đã từng nhắc: extension Zalo/Pancake còn dùng deployment khác.
      # ID deployment Web App đang được extension gọi tới (phần giữa /macros/s/ và /exec).
      # Giữ nguyên ID để URL không đổi. Muốn đổi: tạo Variable GAS_DEPLOYMENT_ID trong repo.
      DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID || 'AKfycbx3QT6YIzQ7SQEwQPkljVeEdmTSBQQSxtTp2hTFYOeCKB_K4BHcUTSLi54LlmB9q_E6sQ' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Kiểm tra secret
        run: |
          [ -n "${{ secrets.CLASPRC_JSON }}" ] || { echo "::error::Thiếu secret CLASPRC_JSON (xem docs/GAS-AUTO-DEPLOY.md)"; exit 1; }
          [ -n "${{ secrets.GAS_SCRIPT_ID }}" ] || { echo "::error::Thiếu secret GAS_SCRIPT_ID"; exit 1; }

      - name: Sinh lại gas/*.gs từ gas_v13.js và đối chiếu
        run: |
          node tools/split-gas.js
          node tools/split-gas.js --check

      - name: Kiểm tra cú pháp từng file .gs
        run: |
          mkdir -p /tmp/syn
          for f in gas/*.gs; do
            cp "$f" "/tmp/syn/$(basename "$f").js"
            node --check "/tmp/syn/$(basename "$f").js" || { echo "::error::Lỗi cú pháp trong $f"; exit 1; }
          done
          echo "Cú pháp OK: $(ls gas/*.gs | wc -l) file"

      - name: Nạp đăng nhập clasp (tự nhận dạng định dạng file, chỉ in tên khoá, không in giá trị)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          # Truyền secret qua biến môi trường (không chèn thẳng vào dòng lệnh) để dấu nháy/xuống dòng trong JSON không làm hỏng file.
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          # clasp 2.x lưu {"token":{...}}; clasp 3.x lưu {"tokens":{"default":{...}}} — mỗi bản chỉ đọc được định dạng của nó.
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.env.HOME + "/.clasprc.json", "utf8")); }
            catch (e) { console.log("::error::Secret CLASPRC_JSON không phải JSON hợp lệ (dán thiếu/thừa ký tự?). Chạy lại: cat ~/.clasprc.json và dán TOÀN BỘ từ { đến }."); process.exit(1); }
            console.log("Khoá cấp cao nhất:", Object.keys(j).join(", "));
            const oldFmt = j.token && j.token.refresh_token;
            const newFmt = j.tokens && j.tokens.default && (j.tokens.default.refresh_token || j.tokens.default.access_token);
            if (!oldFmt && !newFmt) {
              console.log("::error::CLASPRC_JSON không có refresh_token. Đăng nhập lại (clasp login --no-localhost), rồi dán lại TOÀN BỘ nội dung ~/.clasprc.json vào secret.");
              process.exit(1);
            }
            fs.writeFileSync("/tmp/clasp_ver", oldFmt ? "2.4.2" : "latest");
            console.log("Định dạng đăng nhập:", oldFmt ? "clasp 2.x (token)" : "clasp 3.x (tokens.default)");
          '
          npm i -g @google/clasp@"$(cat /tmp/clasp_ver)"
          clasp --version

      - name: Sao lưu dự án hiện tại và lấy appsscript.json
        run: |
          mkdir -p /tmp/pulled && cd /tmp/pulled
          printf '{"scriptId":"%s","rootDir":"."}' "${{ secrets.GAS_SCRIPT_ID }}" > .clasp.json
          clasp pull
          test -f appsscript.json || { echo "::error::Không lấy được appsscript.json"; exit 1; }
          cp appsscript.json "$GITHUB_WORKSPACE/gas/appsscript.json"

      - uses: actions/upload-artifact@v6
        with:
          name: gas-backup-truoc-khi-deploy
          path: /tmp/pulled
          retention-days: 7

      # Mỗi lần deploy tạo 1 PHIÊN BẢN mới; Apps Script chỉ cho tối đa 200 phiên bản/dự án và API KHÔNG xoá được phiên bản (chỉ xoá tay trên giao diện).
      # Nên: (1) bỏ qua deploy nếu code y hệt bản deployment đang chạy; (2) cảnh báo sớm khi sắp đầy. Mọi lỗi ở bước so sánh => cứ deploy (an toàn).
      - name: So với bản đang chạy và đếm số phiên bản (tránh deploy thừa, báo sớm khi sắp đủ 200)
        id: cmp
        run: |
          printf '{"scriptId":"%s","rootDir":"gas"}' "${{ secrets.GAS_SCRIPT_ID }}" > .clasp.json
          echo "same=false" >> "$GITHUB_OUTPUT"
          N=$(clasp versions 2>/dev/null | head -1 | grep -oE '^[0-9]+' || true)
          if [ -n "$N" ]; then
            echo "Số phiên bản hiện có: $N / 200"
            if [ "$N" -ge 190 ]; then echo "::error title=Apps Script sắp/đã đủ 200 phiên bản ($N)::Vào script.google.com → dự án → Lịch sử dự án (Project history) → chọn các phiên bản CŨ (giữ khoảng 20 bản mới nhất) → Xoá. Nếu không, lần deploy sau sẽ lỗi."; 
            elif [ "$N" -ge 150 ]; then echo "::warning title=Apps Script đã có $N/200 phiên bản::Nên dọn các phiên bản cũ trong Lịch sử dự án (Project history) trước khi đầy."; fi
          fi
          DEP=$(clasp deployments 2>/dev/null | grep -F "$DEPLOYMENT_ID" | grep -oE '@[0-9]+' | head -1 | tr -d '@' || true)
          if [ -n "$DEP" ]; then
            echo "Deployment đang chạy phiên bản @$DEP"
            rm -rf /tmp/live && mkdir -p /tmp/live && ( cd /tmp/live && printf '{"scriptId":"%s","rootDir":"."}' "${{ secrets.GAS_SCRIPT_ID }}" > .clasp.json && clasp pull --versionNumber "$DEP" >/dev/null 2>&1 ) || true
            if python3 tools/gas-same-as-live.py gas /tmp/live; then echo "same=true" >> "$GITHUB_OUTPUT"; echo "Code giống hệt bản đang chạy => bỏ qua deploy (không tốn thêm phiên bản)."; fi
          else
            echo "Không đọc được phiên bản của deployment => cứ deploy."
          fi

      - name: Đẩy code lên Apps Script
        if: steps.cmp.outputs.same != 'true'
        run: |
          printf '{"scriptId":"%s","rootDir":"gas"}' "${{ secrets.GAS_SCRIPT_ID }}" > .clasp.json
          clasp push --force

      - name: Cập nhật deployment (giữ nguyên URL)
        if: steps.cmp.outputs.same != 'true'
        run: |
          SHORT=$(git rev-parse --short HEAD)
          set +e
          OUT=$(clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "auto $SHORT $(date -u +%Y-%m-%dT%H:%MZ)" 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            if echo "$OUT" | grep -q "limit of 200 versions"; then
              echo "::error title=Apps Script đã đủ 200 phiên bản::Code đã được đẩy lên nhưng deployment CHƯA cập nhật. Vào script.google.com → dự án → Lịch sử dự án (Project history) → chọn các phiên bản CŨ (giữ ~20 bản mới nhất) → Xoá, rồi bấm Re-run jobs (hoặc Run workflow)."
            fi
            exit $RC
          fi

      # TRUOC DAY buoc nay la `curl ... | head -c 400 || true` => LUON xanh du Google tra trang loi => 'Actions xanh' khong chung minh URL con song
      # (26/10/2026: URL /exec tra trang Google "Rat tiec, khong the mo tep" ma deploy van xanh). Nay phai nhan JSON co "ver", neu khong => DO + ghi ma HTTP/doan dau
      # noi dung vao annotation (doc duoc qua API). Chay CA khi 'same=true' (bo qua deploy) vi muc dich la kiem tra URL CRM dang goi.
      - name: Kiểm tra bản đang chạy (phải trả JSON có "ver", nếu không => đỏ)
        run: |
          sleep 5
          URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec?action=count"
          LAST=""
          for i in 1 2 3; do
            LAST=$(curl -sL --max-time 60 -o /tmp/gas_body.txt -w 'HTTP %{http_code} | type=%{content_type} | url_cuoi=%{url_effective}' "$URL" || echo "curl loi")
            BODY=$(head -c 300 /tmp/gas_body.txt 2>/dev/null | tr '\n\r' '  ')
            echo "Lần $i: $LAST"; echo "   nội dung: $BODY"
            if grep -q '"ver"' /tmp/gas_body.txt 2>/dev/null; then echo "OK: Web App trả JSON có ver."; exit 0; fi
            sleep 10
          done
          echo "::error title=Web App Apps Script KHÔNG trả JSON (CRM/Worker sẽ lỗi 404/502)::$LAST | nội dung: $BODY | deployment=${DEPLOYMENT_ID:0:12}…"
          exit 1
