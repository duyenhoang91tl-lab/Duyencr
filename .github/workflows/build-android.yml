# Tự build app Android "Viết Tắt" (android-viettat/) thành file APK mỗi khi push main có đổi android-viettat/** (hoặc bấm chạy tay).
# APK được đưa lên Release "viettat-latest" để TẢI THẲNG bằng điện thoại, và đính kèm ở mục Artifacts của lần chạy.
# Không cần secret nào (dùng GITHUB_TOKEN có sẵn). APK ký bằng khóa debug -> cài thủ công (bật "Cài từ nguồn không rõ") được.
name: Build Android VietTat

on:
  push:
    branches: [main]
    paths:
      - 'android-viettat/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (debug)
        working-directory: android-viettat
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Đổi tên APK
        run: cp android-viettat/app/build/outputs/apk/debug/app-debug.apk VietTat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VietTat-apk
          path: VietTat.apk
      - name: Đưa APK lên Release viettat-latest (tải thẳng bằng điện thoại)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete viettat-latest -y --cleanup-tag || true
          gh release create viettat-latest VietTat.apk --prerelease \
            --title "Viết Tắt (Android) — bản mới nhất" \
            --notes "Bản build tự động từ commit ${GITHUB_SHA::7}. Tải VietTat.apk trên điện thoại → mở file → cho phép cài từ nguồn không rõ."
